name: IsaMarket Bot (Drafts & Odds Refresh)

on:
  schedule:
    # Avoid the hourly peak; timezone keeps local times stable across DST.
    - cron: '7 8,14 * * *'
      timezone: Europe/Paris
    - cron: '30 20 * * *'
      timezone: Europe/Paris
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isamarket-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Bot Script
        run: node --test scripts/bot.test.mjs

      - name: Run Bot Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: node scripts/bot.js
